<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Кошелёк</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#ffffff);
  --bg2:var(--tg-theme-secondary-bg-color,#f2f2f7);
  --tx:var(--tg-theme-text-color,#111111);
  --hint:var(--tg-theme-hint-color,#8a8a8e);
  --acc:var(--tg-theme-button-color,#2f7cf6);
  --acc-tx:var(--tg-theme-button-text-color,#ffffff);
  --ok:#2e9d5b; --ok-bg:rgba(46,157,91,.12); --warn:#d9822b; --warn-bg:rgba(217,130,43,.13); --bad:#d64545; --bad-bg:rgba(214,69,69,.11);
  --line:rgba(127,127,127,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-tg]){--bg:#17181b;--bg2:#222327;--tx:#f2f2f2;--hint:#8e8e93}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg2);color:var(--tx);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none;min-width:0}
input:focus{border-color:var(--acc)}
h2{margin:4px 0 6px;font-size:22px}
.wrap{max-width:520px;margin:0 auto;padding:12px 14px}
.card{background:var(--bg);border-radius:16px;padding:14px;margin-bottom:10px}
.h{font-size:13px;color:var(--hint);text-transform:uppercase;letter-spacing:.4px;margin:2px 2px 10px;display:flex;justify-content:space-between;align-items:center}
.h button{text-transform:none;letter-spacing:0;color:var(--acc);font-size:14px}
.muted{color:var(--hint)} .small{font-size:13px} .plus{color:var(--ok)} .minus{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center} .grow{flex:1;min-width:0}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:13px 10px;border-radius:14px;background:var(--bg);font-weight:600}
.btn.pri{background:var(--acc);color:var(--acc-tx)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px;background:var(--bg2);font-weight:500}
.btn.sm.pri{background:var(--acc);color:var(--acc-tx)}
.btn.full{width:100%}
.hero{text-align:center;padding:18px 14px 14px}
.hero .lbl{color:var(--hint);font-size:14px}
.hero .big{font-size:48px;font-weight:700;letter-spacing:-1px;margin:0;line-height:1.15}
.hero .sub{color:var(--hint);font-size:14px;margin-top:2px}
.tri{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:14px}
.tri div{background:var(--bg2);border-radius:12px;padding:8px 4px}
.tri small{display:block;color:var(--hint);font-size:11px}
.tri b{font-size:15px}
.main2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.main2 .btn{padding:18px 8px;font-size:17px;border-radius:16px}
.main2 .out{background:var(--acc);color:var(--acc-tx)}
.main2 .in{background:var(--ok);color:#fff}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.acts .btn{flex-direction:column;gap:2px;padding:10px 2px;font-size:12px;font-weight:500}
.acts .btn b{font-size:20px;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:20px;background:var(--bg2);font-size:14px;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--acc-tx)}
.note{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:14px;padding:12px;margin-bottom:8px;font-size:15px}
.note .ic{font-size:20px;line-height:1;flex:none}
.note.warn{background:var(--warn-bg)} .note.bad{background:var(--bad-bg)} .note.ok{background:var(--ok-bg)}
.note .btns{display:flex;flex-direction:column;gap:4px;flex:none}
.quick{display:flex;gap:8px}
.quick input{background:var(--bg2);border:0}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.bar.ok i{background:var(--ok)}
.env-item{padding:12px 0;border-bottom:1px solid var(--line)}
.env-item:last-child{border-bottom:0;padding-bottom:0}
.env-item:first-child{padding-top:0}
.env-top{display:flex;align-items:center;gap:10px}
.env-ic{width:38px;height:38px;border-radius:11px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.env-act{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--bg2);color:var(--hint)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.ok{background:var(--ok-bg);color:var(--ok)}
.stack .kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}
.stack .kv:last-child{border-bottom:0}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .em{width:34px;height:34px;border-radius:10px;background:var(--bg2);display:flex;align-items:center;justify-content:center;flex:none}
.list .meta{font-size:12px;color:var(--hint)}
.list .del{color:var(--hint);padding:6px 8px;font-size:18px}
.day{font-size:13px;color:var(--hint);margin:14px 2px 4px}
.tl .date{width:46px;flex:none;text-align:center;font-size:12px;color:var(--hint);line-height:1.2}
.tl .date b{display:block;font-size:18px;color:var(--tx)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stats div{background:var(--bg2);border-radius:12px;padding:10px 4px;text-align:center}
.stats small{display:block;color:var(--hint);font-size:12px}
.stats b{font-size:15px}
.cat{margin-bottom:10px}
.cat .row{font-size:14px}
.cols{display:flex;align-items:flex-end;gap:4px;height:100px;margin-top:6px}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--hint)}
.cols i{display:block;width:100%;background:var(--acc);border-radius:4px 4px 2px 2px;min-height:2px;margin-bottom:4px;opacity:.55}
.cols div.now i{background:var(--ok);opacity:1}
.cols div.now{color:var(--tx);font-weight:600}
.tip{display:flex;gap:10px;padding:8px 0;font-size:15px;border-bottom:1px solid var(--line)}
.tip:last-child{border-bottom:0}
.tip .ic{flex:none;width:22px;text-align:center}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:14px}
.seg button.on{background:var(--bg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.big button{padding:10px;font-size:15px}
.seg.big button.on.out{background:var(--acc);color:var(--acc-tx)}
.seg.big button.on.in{background:var(--ok);color:#fff}
.tabs{background:var(--bg);margin-bottom:10px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--hint);padding:3px 0}
.nav button b{font-size:20px;font-weight:400;line-height:1.2}
.nav button.on{color:var(--acc)}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.35)}
.sheet.hidden{display:none}
.sheet .box{background:var(--bg);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:18px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--hint);margin:0 2px 4px}
.two{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.half{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.amtView{text-align:center;font-size:44px;font-weight:700;padding:8px 0 4px;letter-spacing:-1px}
.amtView span{font-size:22px;color:var(--hint);font-weight:500}
.amtView.empty{color:var(--hint)}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.catgrid button{background:var(--bg2);border-radius:12px;padding:8px 2px;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:2px;overflow:hidden;white-space:nowrap}
.catgrid button span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.catgrid button b{font-size:20px;font-weight:400}
.catgrid button.on{background:var(--acc);color:var(--acc-tx)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 10px}
.pad button{background:var(--bg2);border-radius:12px;padding:12px 0;font-size:22px;font-weight:500}
.pad button:active{opacity:.6}
.opts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:4px 0}
.opts .chip{font-size:13px;padding:6px 10px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:30;max-width:496px;margin:0 auto;background:#1f1f22;color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast button{color:#7db4ff;font-weight:600;flex:none}
.billrow{background:var(--bg2);border-radius:12px;padding:10px;margin-bottom:8px}
.billrow .two,.billrow .half{margin-top:6px}
.billrow input{background:var(--bg)}
.cash{display:block;width:100%;margin-top:14px;padding:11px;border-radius:12px;background:var(--bg2);font-size:15px}
.chips.mini{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:0 0 10px}
.chips.mini .chip{background:var(--bg);padding:10px 4px;font-size:13px;text-align:center;white-space:normal}
.check{display:flex;gap:10px;align-items:center;padding:6px 2px;font-size:15px}
.check input{width:20px;height:20px;flex:none}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<nav class="nav" id="nav">
  <button data-tab="home" class="on"><b>◎</b>Главная</button>
  <button data-tab="env"><b>🗓</b>Платежи</button>
  <button data-tab="ai"><b>✦</b>Анализ</button>
  <button data-tab="hist"><b>☰</b>История</button>
  <button data-tab="set"><b>⚙︎</b>Ещё</button>
</nav>
<div id="sheet" class="sheet hidden"><div class="box" id="sheetBox"></div></div>
<div id="toast" class="toast"><span id="toastMsg" class="grow"></span><button id="toastUndo">Отменить</button></div>
<script src="app.js?v=4"></script>
</body>
</html>
